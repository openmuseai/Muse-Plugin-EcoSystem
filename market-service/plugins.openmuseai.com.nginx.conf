server {
    listen 80;
    listen [::]:80;
    server_name plugins.openmuseai.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name plugins.openmuseai.com;
    ssl_certificate /etc/letsencrypt/live/plugins.openmuseai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plugins.openmuseai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /health { proxy_pass http://127.0.0.1:18794; }
    location = /v0.1/servers {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18794;
        proxy_set_header Host $host;
    }
    # Large self-contained MCP Apps resources benefit from HTTP compression.
    gzip on;
    gzip_types application/json text/event-stream;
    gzip_min_length 1024;
    gzip_comp_level 5;
    location = /pptx/mcp {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:18797/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
    location = /mcp {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:18796;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
    }
    location /editor/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18796;
        proxy_set_header Host $host;
    }
    location ~ "^/packages/[a-f0-9]{64}\.mcpb$" {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18794;
        proxy_set_header Host $host;
    }
    location / { return 404; }
}
