<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Muse Plugin Registry · 审核台</title><link rel="stylesheet" href="/admin/admin.css"></head>
<body><div class="shell">
<aside class="rail"><div class="brand"><span class="brand-mark">M</span><div>Muse<span class="brand-sub">Plugin Registry</span></div></div><p class="rail-label">工作空间</p><nav><button class="nav active" data-tab="all"><span>◫</span> 所有提交</button><button class="nav" data-tab="pending"><span>◷</span> 待审核</button><button class="nav" data-tab="approved"><span>◈</span> 已上架</button><button class="nav" data-tab="delisted"><span>↘</span> 已下架</button></nav><div class="rail-foot"><span class="live-dot"></span> Registry service <small>独立服务 · v0.1</small></div></aside>
<main><header><div><p class="eyebrow">MARKET OPERATIONS / 审核中心</p><h1>插件审核台<span class="heading-dot">.</span></h1><p class="lede">管理提交、审查安装包，并决定插件在公开目录中的可见性。</p></div><div class="header-actions"><button id="refresh" class="button ghost">↻ &nbsp;刷新</button><span class="avatar">A</span></div></header>
<div id="auth" class="auth"><div><strong>连接审核台</strong><p>输入审核令牌。仅在当前页面内存中保留。</p></div><form id="auth-form"><input id="token" type="password" autocomplete="off" placeholder="Reviewer bearer token" required><button class="button primary">连接</button></form></div>
<section class="stats" aria-label="审核概览"><div class="stat"><span>待审核</span><strong id="count-pending">—</strong><small>等待决定</small></div><div class="stat"><span>已上架</span><strong id="count-approved">—</strong><small>公开目录可见</small></div><div class="stat"><span>已下架</span><strong id="count-delisted">—</strong><small>目录不可见</small></div><div class="stat"><span>全部版本</span><strong id="count-all">—</strong><small>含审核历史</small></div></section>
<section class="workspace"><div class="section-head"><div><p class="eyebrow">SUBMISSIONS</p><h2 id="section-title">所有提交</h2></div><div class="filters"><input id="search" type="search" placeholder="搜索名称或描述"><span id="item-count">0 项</span></div></div><div class="table-wrap"><table><thead><tr><th>插件 / 命名空间</th><th>版本</th><th>状态</th><th>提交时间</th><th></th></tr></thead><tbody id="items"><tr><td colspan="5" class="empty">连接审核台后显示提交记录</td></tr></tbody></table></div></section>
<section class="activity"><div class="section-head"><div><p class="eyebrow">ACTIVITY</p><h2>最近操作</h2></div></div><div id="events" class="events"><p class="muted">暂无操作记录</p></div></section>
</main></div><div id="scrim" class="scrim" hidden></div><aside id="drawer" class="drawer" aria-label="插件详情" hidden><button id="drawer-close" class="drawer-close" aria-label="关闭">×</button><div id="detail"></div></aside><div id="toast" class="toast" role="status" hidden></div><script src="/admin/admin.js" defer></script></body></html>
