[package]
name = "muse-plugin-market"
version = "0.1.0"
edition = "2021"

[features]
default = []
s3 = ["dep:aws-config", "dep:aws-sdk-s3"]

[dependencies]
anyhow = "1"
askama = "0.12"
axum = { version = "0.7", features = ["macros"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
redis = { version = "0.25.2", features = ["aio", "tokio-comp", "connection-manager"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "any", "postgres", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
aws-config = { version = "1.8", optional = true }
aws-sdk-s3 = { version = "1.88", optional = true }

[dev-dependencies]
tower = "0.4"
