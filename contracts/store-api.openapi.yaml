openapi: 3.1.0
info:
  title: OpenMuse Plugin Store API
  version: 0.1.0-draft
  description: Design contract only. No server currently implements these paths. Public API data is not an installation trust root.
servers:
  - url: https://plugins.openmuse.example
paths:
  /v1/catalog:
    get:
      operationId: listCatalog
      parameters:
        - { name: platform, in: query, schema: { type: string, enum: [desktop, mobile, web] } }
        - { name: channel, in: query, schema: { type: string, enum: [stable, beta] } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Discovery results and location of the signed catalog snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [snapshotId, signedIndexUrl, items]
                properties:
                  snapshotId: { type: string }
                  signedIndexUrl: { type: string, format: uri }
                  nextCursor: { type: [string, 'null'] }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PluginSummary' }
  /v1/plugins/{pluginId}:
    get:
      operationId: getPlugin
      parameters: [ { $ref: '#/components/parameters/PluginId' } ]
      responses:
        '200':
          description: Public plugin detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/plugins/{pluginId}/platforms/{platform}/releases/{version}:
    get:
      operationId: getPluginRelease
      parameters:
        - { $ref: '#/components/parameters/PluginId' }
        - { $ref: '#/components/parameters/Platform' }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Exact immutable release metadata. The signed index remains authoritative for installation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Release' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/developer/uploads:
    post:
      operationId: createUpload
      security: [ { BearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sha256, sizeBytes, mediaType]
              properties:
                sha256: { $ref: '#/components/schemas/Sha256' }
                sizeBytes: { type: integer, minimum: 1 }
                mediaType: { type: string }
      responses:
        '201':
          description: A short lived direct upload URL for the quarantine bucket.
          content:
            application/json:
              schema:
                type: object
                required: [uploadId, putUrl, expiresAt]
                properties:
                  uploadId: { type: string }
                  putUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/developer/uploads/{uploadId}/complete:
    post:
      operationId: completeUpload
      security: [ { BearerAuth: [] } ]
      parameters:
        - { name: uploadId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Server verified uploaded bytes and queued isolated scanning.
          content:
            application/json:
              schema:
                type: object
                required: [uploadId, sha256, state]
                properties:
                  uploadId: { type: string }
                  sha256: { $ref: '#/components/schemas/Sha256' }
                  state: { type: string, enum: [scanning] }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/developer/submissions:
    post:
      operationId: submitRelease
      security: [ { BearerAuth: [] } ]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pluginId, platform, version, channel, sourceCommit, uploadIds, releaseNotes, permissionRationale]
              properties:
                pluginId: { type: string }
                platform: { $ref: '#/components/schemas/Platform' }
                version: { type: string }
                channel: { type: string, enum: [stable, beta] }
                sourceCommit: { type: string }
                uploadIds: { type: array, minItems: 1, items: { type: string } }
                releaseNotes: { type: string }
                permissionRationale: { type: object, additionalProperties: { type: string } }
      responses:
        '202':
          description: Submission accepted for review, not yet published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/developer/submissions/{submissionId}:
    get:
      operationId: getSubmission
      security: [ { BearerAuth: [] } ]
      parameters:
        - { name: submissionId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Current review status and machine readable validation failures.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/reports:
    post:
      operationId: reportPlugin
      security: [ { BearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pluginId, reason]
              properties:
                pluginId: { type: string }
                version: { type: string }
                reason: { type: string, enum: [malware, privacy, copyright, content, other] }
                details: { type: string, maxLength: 4000 }
      responses:
        '202': { description: Report accepted. }
  /v1/studio/drafts:
    post:
      operationId: createStudioDraft
      security: [ { BearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intent]
              properties:
                intent: { type: string, maxLength: 8000 }
                template: { type: string, enum: [form, checklist, calculator, reminder, knowledge-card] }
      responses:
        '201':
          description: Draft created; Agent generation and validation may still be running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudioDraft' }
    get:
      operationId: listStudioDrafts
      security: [ { BearerAuth: [] } ]
      responses:
        '200':
          description: Drafts owned by the current account.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StudioDraft' }
  /v1/studio/drafts/{draftId}:
    get:
      operationId: getStudioDraft
      security: [ { BearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/DraftId' } ]
      responses:
        '200':
          description: Latest schema-validated draft revision and status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudioDraft' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/studio/drafts/{draftId}/revise:
    post:
      operationId: reviseStudioDraft
      security: [ { BearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/DraftId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instruction, expectedRevision]
              properties:
                instruction: { type: string, maxLength: 8000 }
                expectedRevision: { type: integer, minimum: 1 }
      responses:
        '202':
          description: New immutable revision queued for Agent generation and validation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudioDraft' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/studio/drafts/{draftId}/preview:
    post:
      operationId: previewStudioDraft
      security: [ { BearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/DraftId' } ]
      responses:
        '200':
          description: Validated preview with no live side effects or real user records.
          content:
            application/json:
              schema:
                type: object
                required: [draftId, revision, profile, messages]
                properties:
                  draftId: { type: string }
                  revision: { type: integer }
                  profile: { type: string }
                  messages: { type: array, items: { type: object } }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/studio/drafts/{draftId}/publish:
    post:
      operationId: publishStudioDraft
      security: [ { BearerAuth: [] } ]
      parameters:
        - { $ref: '#/components/parameters/DraftId' }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, visibility, confirmedPermissions]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
                visibility: { type: string, enum: [private, invite, public] }
                confirmedPermissions: { type: array, items: { type: string } }
      responses:
        '202':
          description: Private version is signed after automated checks; public version enters review.
          content:
            application/json:
              schema:
                type: object
                required: [publishJobId, state]
                properties:
                  publishJobId: { type: string }
                  state: { type: string, enum: [validating, review, signing, published] }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    BearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    PluginId: { name: pluginId, in: path, required: true, schema: { type: string } }
    Platform: { name: platform, in: path, required: true, schema: { $ref: '#/components/schemas/Platform' } }
    DraftId: { name: draftId, in: path, required: true, schema: { type: string } }
  schemas:
    Sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    Platform: { type: string, enum: [desktop, mobile, web] }
    PluginSummary:
      type: object
      required: [id, name, publisher, verifiedPlatforms]
      properties:
        id: { type: string }
        name: { type: string }
        publisher: { type: string }
        verifiedPlatforms: { type: array, items: { type: string, enum: [desktop, mobile, web] } }
    PluginDetail:
      allOf:
        - { $ref: '#/components/schemas/PluginSummary' }
        - type: object
          required: [description, license, sourceUrl, releases]
          properties:
            description: { type: string }
            license: { type: string }
            sourceUrl: { type: string, format: uri }
            releases:
              type: array
              items:
                type: object
                required: [platform, version]
                properties:
                  platform: { $ref: '#/components/schemas/Platform' }
                  version: { type: string }
    Artifact:
      type: object
      required: [target, runtimeKind, sha256, sizeBytes, abi]
      properties:
        target:
          type: object
          required: [os, arch, libc]
          properties:
            os: { type: string }
            arch: { type: string }
            libc: { type: string }
        runtimeKind: { type: string, enum: [desktop-declarative, desktop-worker, desktop-webview, dsh-sidecar, mobile-a2ui, mobile-quickjs, mobile-webview, web-remote-surface, web-bundle] }
        sha256: { $ref: '#/components/schemas/Sha256' }
        sizeBytes: { type: integer, minimum: 1 }
        abi: { type: string }
        minHostApi: { type: string }
        a2uiProfile: { type: string }
        webBridgeApi: { type: string }
    Release:
      type: object
      required: [pluginId, platform, version, channel, artifacts, state]
      properties:
        pluginId: { type: string }
        platform: { $ref: '#/components/schemas/Platform' }
        version: { type: string }
        channel: { type: string, enum: [stable, beta] }
        artifacts: { type: array, items: { $ref: '#/components/schemas/Artifact' } }
        state: { type: string, enum: [published, revoked] }
        signedIndexUrl: { type: string, format: uri }
    Submission:
      type: object
      required: [id, state]
      properties:
        id: { type: string }
        state: { type: string, enum: [draft, scanning, review, approved, rejected, published] }
        validationErrors:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
              fixtureId: { type: string }
              path: { type: string }
    StudioDraft:
      type: object
      required: [id, revision, state]
      properties:
        id: { type: string }
        pluginId: { type: string }
        revision: { type: integer, minimum: 1 }
        state: { type: string, enum: [generating, needs-input, valid, invalid] }
        spec: { type: object, description: MiniPluginSpec, additionalProperties: true }
        validationErrors:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
  responses:
    Unauthorized: { description: Authentication required. }
    NotFound: { description: Resource not found. }
    Conflict: { description: Immutable version or submission state conflict. }
