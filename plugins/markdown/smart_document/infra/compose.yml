name: muse-smart-document-stage1
services:
  postgres:
    image: pgvector/pgvector@sha256:a9954c7191383f40f291c8ca2a81df2e9ce71909a44cc4bd5d9ebf3b3d130192
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: smartdoc-local-development
      POSTGRES_DB: smartdoc
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartdoc"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
    ports: ["127.0.0.1:16379:6379"]
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data
    environment:
      MINIO_ROOT_USER: smartdoc
      MINIO_ROOT_PASSWORD: smartdoc-local-development
    ports: ["127.0.0.1:19000:9000"]
    volumes: ["minio:/data"]
  gotrue:
    image: appflowyinc/gotrue@sha256:0e61dfce9cfdf14055ef1a2c21fa5e7e02b670a1597cefebd45954e0daf9c5f8
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PORT: 9999
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:19999
      GOTRUE_SITE_URL: http://127.0.0.1:18000
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:*
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_NAMESPACE: auth
      DATABASE_URL: postgres://postgres:smartdoc-local-development@postgres:5432/smartdoc?search_path=auth
      GOTRUE_DB_DATABASE_URL: postgres://postgres:smartdoc-local-development@postgres:5432/smartdoc?search_path=auth
      GOTRUE_JWT_SECRET: smartdoc-stage1-isolated-local-jwt-secret-not-for-production
      GOTRUE_JWT_EXP: 86400
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_ADMIN_GROUP_NAME: supabase_admin
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 1000
      GOTRUE_SMTP_MAX_FREQUENCY: 1ns
      GOTRUE_ADMIN_EMAIL: admin@smartdoc.test
      GOTRUE_ADMIN_PASSWORD: SmartdocLocal123!
    ports: ["127.0.0.1:19999:9999"]
volumes:
  postgres:
  minio:
