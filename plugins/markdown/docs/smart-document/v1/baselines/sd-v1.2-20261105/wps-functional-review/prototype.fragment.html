function handle(action){const [a,arg]=action.split(':');if(a==='close'){close();return;}if(a==='insert'){insertion();return;}if(a==='insertkind'){insertKind(arg);return;}if(a==='panel'){if(['versions','activity'].includes(arg)&&state.role!=='edit'){announce('当前角色不能查看历史与协作记录');return;}state.panel=arg;replyTo=null;drawPanel();persist();return;}if(a==='panelclose'){state.panel='';drawPanel();persist();return;}if(a==='outline'){state.outline=!state.outline;drawBlocks();persist();return;}if(a==='locate'){locate(arg);return;}if(a==='follow'){locate('p1');announce('已定位到周宁的编辑位置（模拟）；不会移动你的输入光标');return;}if(a==='mark'){mark(arg);return;}if(a==='kind'){setKind(arg);return;}if(a==='align'&&editing()&&current()){begin();current().align={left:'center',center:'right',right:'left'}[current().align||'left'];changed('切换段落对齐');draw();return;}if(a==='undo'||a==='redo'){if(!editing())return;const source=a==='undo'?undo:redo,target=a==='undo'?redo:undo;if(!source.length)return;target.push(snapshot());const s=source.pop();state.blocks=s.blocks;state.threads=s.threads;selection=null;changed(a==='undo'?'撤销本机操作':'重做本机操作');draw();return;}
if(a==='share'){share();return;}if(a==='share-save'){state.memberRole=$('.d-member-role').value;persist();close();announce('已保存示例成员权限；未修改真实共享设置');return;}if(a==='members'){show('协作者','<div class="d-member"><span class="d-avatar">林</span><div>林语（你）<small>在线 · 当前文档</small></div><span>编辑者</span></div><div class="d-member"><span class="d-avatar">周</span><div>周宁<small>在线 · 正在编辑「本周进展」</small></div>'+btn('follow-close','查看位置')+'</div><div class="d-member"><span class="d-avatar">陈</span><div>陈溪<small>在线 · 阅读中</small></div></div><p class="d-muted">示例在线状态；不会读取参考文档成员。</p>','members');return;}if(a==='follow-close'){close();locate('p1');return;}if(a==='review'){review();return;}if(a==='review-save'){state.role=$('.d-review-role').value;state.connection=$('.d-review-connection').value;if(state.role!=='edit'&&['versions','activity'].includes(state.panel))state.panel='comments';preview=null;selection=null;persist();close();draw();return;}if(a==='connection'){show('保存与同步','<div class="d-member"><div>本机保存<small>原型状态保存在当前评审会话</small></div><span>模拟</span></div><div class="d-member"><div>云端同步<small>'+esc(state.connection==='online'?'示例已确认回执':'尚未共享新的本机改动')+'</small></div><span>'+esc(state.connection)+'</span></div><p class="d-muted">此视觉稿不连接 Cloud，不代表实际磁盘耐久或多人收敛已通过验证。</p>'+btn('retry','恢复在线演示','d-primary'),'connection');return;}if(a==='retry'){state.connection='online';close();draw();persist();return;}
if(a==='file'){show('文件','<div class="d-menu-list">'+btn('openversions','历史记录 · 历史版本')+btn('openactivity','历史记录 · 协作记录')+btn('openresolved','历史记录 · 历史评论')+btn('info','文档信息')+'</div>','file');return;}if(['openversions','openactivity','openresolved'].includes(a)){close();if(a==='openresolved'){commentFilter='resolved';handle('panel:comments');}else handle(a==='openversions'?'panel:versions':'panel:activity');return;}if(a==='info'){show('文档信息','<div class="d-member"><div>内容类型</div><span>智能文档</span></div><div class="d-member"><div>当前正文版本</div><span>v'+state.revision+'</span></div><p class="d-muted">演示资源 ID：doc-weekly-01。数据集和 PDF 拥有独立对象身份。</p>','info');return;}if(a==='editmenu'){show('编辑','<div class="d-menu-list">'+btn('editundo','撤销当前本机操作')+btn('editredo','重做当前本机操作')+'</div>','editmenu');return;}if(a==='editundo'||a==='editredo'){close();handle(a==='editundo'?'undo':'redo');return;}if(a==='formatmenu'){show('段落格式','<div class="d-menu-list">'+btn('style:p','正文')+btn('style:h2','标题二')+btn('style:quote','引用')+btn('style:callout','高亮块')+'</div>','formatmenu');return;}if(a==='style'){close();setKind(arg);return;}if(a==='view'){show('查看','<div class="d-menu-list">'+btn('toggleoutline','显示 / 隐藏目录')+btn('openactivity','协作记录')+btn('openversions','历史版本')+'</div>','view');return;}if(a==='toggleoutline'){close();handle('outline');return;}
if(a==='block'){active=arg;const b=current();selection=null;drawSelection();show('段落操作','<div class="d-muted">'+esc(b?.text.slice(0,50))+'</div><div class="d-menu-list">'+btn('blockinsert','下方插入')+btn('duplicate','复制当前块')+btn('moveup','上移')+btn('movedown','下移')+btn('copylink','复制段落链接')+btn('deleteblock','移除当前块')+'</div>','block');$$('.d-menu-list button').forEach(b=>b.disabled=!editing()&&b.dataset.action!=='copylink');return;}if(a==='blockinsert'){close();insertion();return;}if(['duplicate','moveup','movedown','deleteblock'].includes(a)){if(!editing())return;begin();const i=state.blocks.findIndex(b=>b.id===active);if(i<0)return;if(a==='duplicate'){const b=clone(state.blocks[i]);b.id='b'+Date.now();state.blocks.splice(i+1,0,b);active=b.id;}if(a==='moveup'&&i>0)[state.blocks[i-1],state.blocks[i]]=[state.blocks[i],state.blocks[i-1]];if(a==='movedown'&&i<state.blocks.length-1)[state.blocks[i+1],state.blocks[i]]=[state.blocks[i],state.blocks[i+1]];if(a==='deleteblock'){state.blocks.splice(i,1);state.threads.filter(t=>t.block===active).forEach(t=>t.resolved=true);active=state.blocks[0]?.id;}selection=null;changed(a==='deleteblock'?'移除块；外部来源与评论记录保留':'调整段落');close();draw();return;}if(a==='copylink'){show('段落链接','<input aria-label="段落链接" value="muse://resource/doc-weekly-01#block='+esc(active)+'" readonly><p class="d-muted">可选择复制示例链接；链接不授予访问权。</p>','link');return;}
if(a==='newcomment'||a==='commentat'){if(!commenting()){announce('当前无法发送评论，请检查角色与连接');return;}if(a==='commentat'){active=arg;selection=null;}replyTo=null;state.panel='comments';commentFilter='open';drawPanel();$('.d-comment-input')?.focus();persist();return;}if(a==='mention'){const el=$('.d-comment-input');if(el&&!el.disabled){el.value+='@周宁 ';el.focus();}return;}if(a==='reply'){if(!commenting())return;replyTo=arg;drawPanel();$('.d-comment-input')?.focus();return;}if(a==='postcomment'){if(!commenting())return;const text=$('.d-comment-input').value.trim();if(!text)return;if(replyTo){state.threads.find(t=>t.id===replyTo)?.replies.push({author:'你',text});replyTo=null;}else state.threads.push({id:'c'+Date.now(),block:selection?.block||active,quote:selection?.text||current()?.text.slice(0,60)||'当前段落',author:'你',text,resolved:false,replies:[]});changed('发布评论（模拟）；提及通知未实际发送');drawBlocks();drawPanel();return;}if(a==='filter'){commentFilter=arg;drawPanel();return;}if(a==='resolve'){if(!commenting())return;const t=state.threads.find(t=>t.id===arg);if(t){t.resolved=!t.resolved;changed(t.resolved?'评论已解决并隐藏':'评论已重新打开',t.block);}drawBlocks();drawPanel();return;}
if(a==='preview'){if(state.role!=='edit')return;preview=state.versions.find(v=>v.id===arg);selection=null;draw();announce('正在只读预览历史正文；外部对象仍保持独立');return;}if(a==='exitpreview'){preview=null;draw();return;}if(a==='checkpoint'){if(!editing())return;show('保存命名版本','<label class="d-label">版本名称</label><input class="d-version-name" aria-label="版本名称" value="评审检查点"><div class="d-thread-actions">'+btn('savecheckpoint','保存版本','d-primary')+'</div>','checkpoint');return;}if(a==='savecheckpoint'){const name=$('.d-version-name').value.trim();if(!name)return;state.versions.push({id:'v'+Date.now(),name,blocks:clone(state.blocks),author:'你',time:'刚刚'});state.versions=state.versions.slice(-5);close();drawPanel();persist();return;}if(a==='restore'){if(state.role!=='edit')return;show('恢复历史版本','<p>将恢复选定版本的正文，并创建新的恢复版本。</p><p class="d-muted">数据集记录、PDF 来源与其他独立对象不会回滚。本地未同步内容先保留到版本列表。</p>'+btn('confirmrestore:'+arg,'恢复正文','d-primary'),'restore');return;}if(a==='confirmrestore'){if(state.role!=='edit')return;const v=state.versions.find(v=>v.id===arg);if(!v)return;begin();state.versions.push({id:'v'+Date.now(),name:'恢复前的本机内容',blocks:clone(state.blocks),author:'你',time:'刚刚'});state.blocks=clone(v.blocks);preview=null;selection=null;changed('恢复历史正文，生成新版本；未回滚数据集');state.versions.push({id:'v'+(Date.now()+1),name:'恢复自 '+v.name,blocks:clone(state.blocks),author:'你',time:'刚刚'});state.versions=state.versions.slice(-5);close();draw();return;}
if(a==='task'){if(!editing()||state.connection!=='online'){announce('当前不能提交数据记录；正文离线能力独立');return;}const t=state.tasks[+arg];t.status={'待开始':'进行中','进行中':'已完成','已完成':'待开始'}[t.status];changed('更新同一数据源的任务状态','ds1');drawBlocks();if(modal==='dataset')sourceDataset();return;}if(a==='source'){if(arg==='dataset')sourceDataset();else show('引用来源','<div class="d-source">'+icon('file-text')+'<div><strong>交互规范.pdf</strong><small>pdf-01 · v4 · 第 3 页</small></div></div><p class="d-muted">固定版本只读引用示例。不包含真实 PDF 页面渲染。生产中由 ioffice PDF provider 提供页面与文本。</p>','pdf');return;}
if(a==='generate'){const b=current();if(!b||['dataset','resource','table'].includes(b.kind)){announce('请先选择一个文字段落');return;}agentDraft={base:state.revision,target:b.id,text:'下一步：完成中文输入、选区评论与多人编辑的联合验证。'};drawPanel();return;}if(a==='applyagent'){if(!editing()||!agentDraft)return;if(agentDraft.base!==state.revision){announce('目标内容已变化，请重新读取后生成建议');return;}const b=state.blocks.find(b=>b.id===agentDraft.target);if(!b){announce('目标已删除');return;}begin();b.text+='\n'+agentDraft.text;b.marks=[];changed('Agent 提交已校验建议',b.id);agentDraft=null;draw();return;}}
function sourceDataset(){show('迭代任务 · 独立数据集','<div class="d-muted">对象 tasks-01；与文档内视图共用记录</div><div class="d-table-wrap"><table><thead><tr><th>任务</th><th>负责人</th><th>状态</th></tr></thead><tbody>'+state.tasks.map((t,i)=>'<tr><td>'+esc(t.name)+'</td><td>'+esc(t.owner)+'</td><td>'+btn('task:'+i,esc(t.status))+'</td></tr>').join('')+'</tbody></table></div>','dataset');}
root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled)handle(b.dataset.action);});
window.addEventListener('openai:set_globals',e=>{const v=e.detail?.globals?.widgetState;if(!v||JSON.stringify(v)===lastSignature)return;load(v);draw();});
draw();
if(globalThis.Tweak){const opts={outline:state.outline,readingWidth:840};const tweak=new Tweak({container:root,onChange:()=>{state.outline=opts.outline;$('.d-page').style.maxWidth=opts.readingWidth+'px';$('.d-outline').hidden=!state.outline;}});tweak.addToggle(opts,'outline',{label:'显示目录'});tweak.addSlider(opts,'readingWidth',{label:'正文最大宽度',min:640,max:980,step:20,unit:'px'});}
})();
</script>
