<div id="muse-resource-review">
  <style>
    #muse-resource-review { color-scheme:light dark; --m-bg:light-dark(#ffffff,#191b20); --m-side:light-dark(#f7f8fb,#202228); --m-ink:light-dark(#29292d,#e5e7ec); --m-sub:light-dark(#72727c,#a8adb8); --m-line:light-dark(#ececf0,#383b43); --m-accent:light-dark(#4c63d9,#b7beff); --m-onaccent:light-dark(#ffffff,#20243e); --m-selected:light-dark(#e9ecfb,#2d334e); --m-soft:light-dark(#f1f3f8,#292d36); --m-good:light-dark(#287650,#87c9a7); --m-warn:light-dark(#965a19,#efc28e); --m-bad:light-dark(#b13838,#f1a1a1); --m-paper:light-dark(#faf9f6,#22252a); --m-shadow:light-dark(#21243322,#00000066); font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--m-ink); }
    #muse-resource-review .app * { box-sizing:border-box; }
    #muse-resource-review .app button,#muse-resource-review .app input,#muse-resource-review .app textarea,#muse-resource-review .app select { font:inherit; color:inherit; }
    #muse-resource-review .app button { border:1px solid var(--m-line); background:var(--m-bg); border-radius:7px; padding:6px 10px; display:inline-flex; align-items:center; justify-content:center; gap:6px; cursor:var(--cursor-interaction,default); }
    #muse-resource-review .app button:hover { background:var(--m-soft); }
    #muse-resource-review .app button:disabled { opacity:.5; cursor:not-allowed; }
    #muse-resource-review .app button.primary { background:var(--m-accent); color:var(--m-onaccent); border-color:var(--m-accent); }
    #muse-resource-review .app button.quiet { background:transparent; border-color:transparent; }
    #muse-resource-review .app button.selected { background:var(--m-selected); color:var(--m-accent); border-color:transparent; }
    #muse-resource-review .app svg { width:16px; height:16px; flex-shrink:0; }
    #muse-resource-review .small { font-size:12px; color:var(--m-sub); }
    #muse-resource-review .muted { color:var(--m-sub); }
    #muse-resource-review .good { color:var(--m-good); }
    #muse-resource-review .warning { color:var(--m-warn); }
    #muse-resource-review .danger { color:var(--m-bad); }
    #muse-resource-review .app h1 { font-size:27px; line-height:1.35; font-weight:600; margin:0 0 14px; letter-spacing:-.6px; }
    #muse-resource-review .app h2 { font-size:18px; font-weight:600; margin:25px 0 12px; }
    #muse-resource-review .app h3 { font-size:14px; font-weight:600; margin:0; }
    #muse-resource-review .app p { margin:0 0 12px; }
    #muse-resource-review .stage { min-height:1240px; }
    #muse-resource-review .app { background:var(--m-bg); border:1px solid var(--m-line); border-radius:12px; overflow:clip; position:relative; min-height:820px; }
    #muse-resource-review .windowbar { min-height:37px; background:var(--m-side); border-bottom:1px solid var(--m-line); display:flex; align-items:center; gap:7px; padding:0 14px; color:var(--m-sub); font-size:12px; }
    #muse-resource-review .traffic { display:flex; gap:5px; margin-right:10px; }
    #muse-resource-review .traffic span { width:9px; height:9px; border-radius:50%; background:var(--m-line); }
    #muse-resource-review .windowbar .prototype-label { margin-left:auto; padding-right:84px; }
    #muse-resource-review .workbench { display:grid; grid-template-columns:164px minmax(0,1fr); min-height:780px; }
    #muse-resource-review .sidebar { background:var(--m-side); padding:17px 10px; border-right:1px solid var(--m-line); display:flex; flex-direction:column; gap:8px; min-width:0; }
    #muse-resource-review .brand { display:flex; gap:9px; align-items:center; font-weight:600; padding:0 6px 15px; }
    #muse-resource-review .brandmark { background:var(--m-selected); border-radius:8px; padding:7px; color:var(--m-accent); }
    #muse-resource-review .sidebar button { width:100%; justify-content:flex-start; text-align:left; padding:7px 8px; }
    #muse-resource-review .sidebar .section-label { padding:18px 8px 2px; font-size:11px; color:var(--m-sub); }
    #muse-resource-review .sidebar .bottom { margin-top:auto; padding-top:24px; }
    #muse-resource-review .main { min-width:0; }
    #muse-resource-review .tabs { display:flex; align-items:center; flex-wrap:wrap; min-height:42px; background:var(--m-side); border-bottom:1px solid var(--m-line); padding:0 9px; gap:4px; }
    #muse-resource-review .tabs button { font-size:12px; border-radius:6px 6px 0 0; padding:10px 12px; }
    #muse-resource-review .tabs button.current { background:var(--m-bg); box-shadow:inset 0 -2px var(--m-accent); }
    #muse-resource-review .resourcebar { padding:12px 16px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; border-bottom:1px solid var(--m-line); }
    #muse-resource-review .crumb { font-size:12px; color:var(--m-sub); flex:1; min-width:110px; }
    #muse-resource-review .resource-title { font-size:13px; color:var(--m-ink); font-weight:500; }
    #muse-resource-review .status { font-size:12px; }
    #muse-resource-review .avatars { display:flex; padding-left:6px; align-items:center; }
    #muse-resource-review .avatar { background:var(--m-selected); color:var(--m-accent); border:2px solid var(--m-bg); border-radius:50%; width:26px; height:26px; display:grid; place-items:center; font-size:11px; margin-left:-5px; }
    #muse-resource-review .bodygrid { display:grid; grid-template-columns:minmax(0,1fr) 252px; }
    #muse-resource-review .document { padding:32px clamp(18px,3.2vw,44px) 32px; min-width:0; }
    #muse-resource-review .eyebrow { font-size:12px; color:var(--m-sub); margin-bottom:10px; display:flex; align-items:center; gap:7px; }
    #muse-resource-review .doc-meta { display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--m-sub); padding-bottom:20px; }
    #muse-resource-review .editable { border-left:2px solid transparent; padding:8px 10px; margin:0 -10px 8px; border-radius:4px; outline-offset:3px; }
    #muse-resource-review .editable:focus { border-left-color:var(--m-accent); background:var(--m-soft); }
    #muse-resource-review .remote-line { color:var(--m-accent); display:flex; gap:6px; align-items:center; font-size:11px; margin:4px 0 12px; }
    #muse-resource-review .resource-block { border:1px solid var(--m-line); border-radius:9px; margin:16px 0; overflow:clip; }
    #muse-resource-review .blockhead { padding:10px 12px; display:flex; align-items:center; gap:7px; flex-wrap:wrap; background:var(--m-side); border-bottom:1px solid var(--m-line); }
    #muse-resource-review .blockhead strong { font-size:13px; font-weight:500; }
    #muse-resource-review .blockhead .source-btn { margin-left:auto; font-size:11px; padding:3px 6px; }
    #muse-resource-review .viewtools { padding:7px 9px; display:flex; gap:4px; align-items:center; flex-wrap:wrap; }
    #muse-resource-review .viewtools button { padding:4px 8px; font-size:12px; }
    #muse-resource-review .viewtools .count { margin-left:auto; font-size:11px; color:var(--m-sub); }
    #muse-resource-review table { border-collapse:collapse; width:100%; font-size:12px; }
    #muse-resource-review th,#muse-resource-review td { padding:9px 10px; text-align:left; border-top:1px solid var(--m-line); overflow-wrap:anywhere; }
    #muse-resource-review th { font-weight:500; color:var(--m-sub); background:var(--m-side); }
    #muse-resource-review td button { font-size:11px; padding:3px 6px; white-space:nowrap; }
    #muse-resource-review .kanban { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; padding:10px; }
    #muse-resource-review .lane { background:var(--m-side); padding:8px; border-radius:6px; min-width:0; }
    #muse-resource-review .lane .small { margin-bottom:8px; }
    #muse-resource-review .task { background:var(--m-bg); padding:8px; border:1px solid var(--m-line); border-radius:5px; margin:7px 0; font-size:12px; }
    #muse-resource-review .task button { margin-top:8px; width:100%; font-size:11px; }
    #muse-resource-review .excerpt { background:var(--m-paper); padding:18px 20px; margin:12px; border:1px solid var(--m-line); }
    #muse-resource-review .excerpt-rule { height:4px; background:var(--m-line); width:66%; margin:12px 0; border-radius:2px; }
    #muse-resource-review .excerpt-title { font-size:16px; font-weight:500; margin-bottom:12px; }
    #muse-resource-review .source-meta { padding:0 13px 12px; font-size:11px; color:var(--m-sub); }
    #muse-resource-review .context { border-left:1px solid var(--m-line); background:var(--m-bg); display:flex; flex-direction:column; min-width:0; }
    #muse-resource-review .context-tabs { display:flex; gap:2px; padding:10px 8px; border-bottom:1px solid var(--m-line); flex-wrap:wrap; }
    #muse-resource-review .context-tabs button { font-size:12px; padding:5px 9px; }
    #muse-resource-review .context-content { padding:17px 14px; }
    #muse-resource-review .context-content p { font-size:12px; }
    #muse-resource-review .scope { background:var(--m-side); border:1px solid var(--m-line); border-radius:7px; padding:10px; margin:12px 0; }
    #muse-resource-review .scope select { width:100%; background:var(--m-bg); border:1px solid var(--m-line); padding:6px; border-radius:4px; margin-top:6px; }
    #muse-resource-review .prompt { width:100%; min-height:84px; resize:vertical; padding:10px; border:1px solid var(--m-line); background:var(--m-bg); border-radius:7px; }
    #muse-resource-review .actionrow { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
    #muse-resource-review .proposal { padding:12px; background:var(--m-side); border:1px solid var(--m-line); border-radius:7px; margin:15px 0; }
    #muse-resource-review .proposal p { margin:8px 0; }
    #muse-resource-review .panel-note { font-size:11px; color:var(--m-sub); margin-top:14px; }
    #muse-resource-review .comment-item { padding:12px 0; border-bottom:1px solid var(--m-line); }
    #muse-resource-review .comment-item strong { font-size:12px; font-weight:500; }
    #muse-resource-review .comment-item p { margin-top:6px; }
    #muse-resource-review .history-item { width:100%; justify-content:space-between; margin:8px 0; font-size:12px; text-align:left; }
    #muse-resource-review .notice { padding:10px 14px; background:var(--m-soft); color:var(--m-sub); font-size:12px; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
    #muse-resource-review .footer { border-top:1px solid var(--m-line); padding:7px 14px; font-size:11px; color:var(--m-sub); display:flex; justify-content:space-between; gap:8px; }
    #muse-resource-review .dialog-layer { position:absolute; inset:37px 0 0; background:light-dark(#21243333,#00000077); display:flex; justify-content:center; align-items:flex-start; padding:65px 18px 25px; z-index:8; }
    #muse-resource-review .dialog { width:min(440px,100%); background:var(--m-bg); border:1px solid var(--m-line); border-radius:12px; box-shadow:0 12px 50px var(--m-shadow); padding:20px; }
    #muse-resource-review .dialog-title { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    #muse-resource-review .dialog-title h2 { margin:0; }
    #muse-resource-review .option { display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--m-line); }
    #muse-resource-review .option button { margin-left:auto; }
    #muse-resource-review .dialog label { display:block; margin:12px 0; }
    #muse-resource-review .dialog input,#muse-resource-review .dialog select { background:var(--m-bg); border:1px solid var(--m-line); border-radius:6px; padding:8px; width:100%; margin-top:5px; }
    #muse-resource-review .toast { background:var(--m-selected); color:var(--m-accent); padding:9px 14px; font-size:12px; border-top:1px solid var(--m-line); }
    #muse-resource-review .mobile-tools { display:none; }
    #muse-resource-review .focus .sidebar { display:none; }
    #muse-resource-review .focus .workbench { grid-template-columns:minmax(0,1fr); }
    #muse-resource-review .focus .bodygrid { grid-template-columns:minmax(0,1fr); }
    #muse-resource-review .focus .document { max-width:730px; width:100%; margin:auto; padding:38px 48px; }
    #muse-resource-review .focus .context { display:none; }
    #muse-resource-review .focus.show-context .bodygrid { grid-template-columns:minmax(0,1fr) 270px; }
    #muse-resource-review .focus.show-context .context { display:flex; }
    #muse-resource-review .mobile-stage { padding:14px 0; }
    #muse-resource-review .mobile { width:min(390px,100%); margin:auto; }
    #muse-resource-review .mobile .windowbar { min-height:32px; }
    #muse-resource-review .mobile .traffic,#muse-resource-review .mobile .sidebar,#muse-resource-review .mobile .avatars { display:none; }
    #muse-resource-review .mobile .windowbar .prototype-label { padding-right:0; }
    #muse-resource-review .mobile .workbench { display:block; min-height:740px; }
    #muse-resource-review .mobile .bodygrid { display:block; }
    #muse-resource-review .mobile .resourcebar { padding:10px; }
    #muse-resource-review .mobile .resourcebar .crumb { min-width:100%; }
    #muse-resource-review .mobile .document { padding:23px 17px; }
    #muse-resource-review .mobile h1 { font-size:23px; }
    #muse-resource-review .mobile .context { display:none; position:absolute; top:148px; left:10px; right:10px; z-index:6; border:1px solid var(--m-line); border-radius:9px; background:var(--m-bg); box-shadow:0 16px 40px var(--m-shadow); }
    #muse-resource-review .mobile.show-context .context { display:flex; }
    #muse-resource-review .mobile.show-context .document { opacity:.3; }
    #muse-resource-review .mobile .mobile-tools { display:flex; gap:4px; justify-content:space-around; padding:8px; background:var(--m-side); border-top:1px solid var(--m-line); flex-wrap:wrap; }
    #muse-resource-review .mobile .mobile-tools button { min-height:42px; }
    #muse-resource-review .mobile .kanban { grid-template-columns:1fr; }
    #muse-resource-review .mobile .dialog-layer { padding:60px 10px 20px; }
    #muse-resource-review .mobile .footer { flex-wrap:wrap; }
    @media(max-width:760px) {
      #muse-resource-review .workbench { grid-template-columns:minmax(0,1fr); }
      #muse-resource-review .sidebar { display:none; }
      #muse-resource-review .bodygrid,#muse-resource-review .focus.show-context .bodygrid { grid-template-columns:minmax(0,1fr); }
      #muse-resource-review .context { border-left:0; border-top:1px solid var(--m-line); }
      #muse-resource-review .document,#muse-resource-review .focus .document { padding:25px 18px; }
      #muse-resource-review .windowbar .prototype-label { padding-right:0; }
      #muse-resource-review .avatars { display:none; }
      #muse-resource-review .resourcebar { padding:10px; }
      #muse-resource-review .app h1 { font-size:23px; }
    }
    @media(max-width:390px) {
      #muse-resource-review .kanban { grid-template-columns:1fr; }
      #muse-resource-review th,#muse-resource-review td { padding:8px 6px; }
      #muse-resource-review .resourcebar button { padding:6px 7px; }
    }
    @media(pointer:coarse) { #muse-resource-review .app button { min-height:44px; } #muse-resource-review .app input,#muse-resource-review .app textarea,#muse-resource-review .app select { font-size:16px; } }
  </style>
  <div class="viz-carousel" aria-label="Muse 智能资源交互方案" data-previous-label="上一方案" data-next-label="下一方案">
    <section data-variant="工作区协作" aria-label="工作区协作方案"><div class="stage"><div class="app" data-layout="workbench"></div></div></section>
    <section data-variant="专注创作" aria-label="专注创作方案" hidden><div class="stage"><div class="app focus" data-layout="focus"></div></div></section>
    <section data-variant="移动端" aria-label="移动端方案" hidden><div class="stage mobile-stage viz-dotted-background"><div class="app mobile" data-layout="mobile"></div></div></section>
  </div>
  <script>
    (() => {
      const root = document.getElementById('muse-resource-review');
      const base = {
        route:'document', panel:'agent', board:false, connected:'online', role:'edit',
        text:'把产品决策、任务数据和原始材料放在同一份工作页面。团队共同维护内容，Agent 根据指定材料生成可追溯的结果。',
        revision:1, proposal:null, applied:'', embed:true, datasetEmbed:true, dialog:'', toast:'', history:false,
        tasks:[{id:'t1',name:'统一资源入口',owner:'林晓',status:2},{id:'t2',name:'智能文档交互评审',owner:'你',status:1},{id:'t3',name:'移动端关键流程',owner:'陈辰',status:0}],
        comments:[{author:'林晓',text:'这里需要明确：移除引用，不会删除源数据集。'}],
        scope:'selection', shownPanel:{workbench:true,focus:false,mobile:false}
      };
      let state = structuredClone(base);
      let lastSavedSignature = null;
      const labels = ['待开始','进行中','已完成'];
      const escapeText = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const icon = name => '<i data-lucide="'+name+'" aria-hidden="true"></i>';
      const button = (action,label,cls,extra) => '<button type="button" data-action="'+action+'" class="'+(cls||'')+' cursor-interaction" '+(extra||'')+'>'+label+'</button>';
      const canEdit = () => state.role==='edit' && state.connected!=='revoked' && !state.history;
      const save = () => {
        if (window.openai && window.openai.setWidgetState) {
          const privateState = {...state,dialog:'',toast:''};
          lastSavedSignature = JSON.stringify(privateState);
          window.openai.setWidgetState({modelContent:{screen:state.route,panel:state.panel,connection:state.connected,role:state.role,view:state.board?'kanban':'table'},privateContent:privateState}).catch(()=>{});
        }
      };
      const restore = saved => {
        const p=saved && saved.privateContent;
        if(p && ['document','dataset','office'].includes(p.route) && Array.isArray(p.tasks) && p.tasks.length===3 && p.shownPanel) {
          state={...structuredClone(base),...p,dialog:'',toast:''};
          state.tasks=p.tasks.map((t,i)=>({...base.tasks[i],status:[0,1,2].includes(t.status)?t.status:base.tasks[i].status}));
          state.role=['edit','comment','view'].includes(state.role)?state.role:'edit';
          state.connected=['online','offline','unavailable','revoked'].includes(state.connected)?state.connected:'online';
          state.panel=['agent','comments','history'].includes(state.panel)?state.panel:'agent';
        }
      };
      const statusText=()=>({online:'云端已确认',offline:'已保存到本机 · 离线',unavailable:'已保存到本机 · 协作暂不可用',revoked:'访问已撤销'}[state.connected]);
      const taskView=()=>{
        if(state.board) return '<div class="kanban">'+labels.map((label,s)=>'<div class="lane"><div class="small">'+label+'</div>'+state.tasks.filter(t=>t.status===s).map(t=>'<div class="task">'+escapeText(t.name)+'<div class="small">'+escapeText(t.owner)+'</div>'+button('task:'+t.id,'变更状态','',canEdit()&&state.connected==='online'?'':'disabled')+'</div>').join('')+'</div>').join('')+'</div>';
        return '<table aria-label="项目任务数据集"><thead><tr><th>任务</th><th>负责人</th><th>状态</th></tr></thead><tbody>'+state.tasks.map(t=>'<tr><td>'+escapeText(t.name)+'</td><td>'+escapeText(t.owner)+'</td><td>'+button('task:'+t.id,labels[t.status],t.status===2?'good':'',canEdit()&&state.connected==='online'?'':'disabled')+'</td></tr>').join('')+'</tbody></table>';
      };
      const datasetBlock=standalone=>'<div class="resource-block"><div class="blockhead">'+icon('database')+'<strong>发布任务</strong><span class="small">共享数据集</span>'+(!standalone?button('route:dataset','打开来源 '+icon('arrow-up-right'),'quiet source-btn')+button('remove:dataset',icon('unlink'),'quiet','aria-label="移除数据集引用" '+(canEdit()?'':'disabled')):'')+'</div><div class="viewtools">'+button('view:table',icon('table-2')+' 表格',!state.board?'selected':'')+button('view:board',icon('columns-3')+' 看板',state.board?'selected':'')+'<span class="count">3 条记录 · 同一来源</span></div>'+taskView()+'</div>';
      const officeBlock=standalone=>'<div class="resource-block"><div class="blockhead">'+icon('file-text')+'<strong>产品定位.pdf</strong><span class="small">第 3 页 · 固定版本 v12</span>'+(!standalone?button('route:office','打开来源 '+icon('arrow-up-right'),'quiet source-btn')+button('remove:office',icon('unlink'),'quiet','aria-label="移除材料引用" '+(canEdit()?'':'disabled')):'')+'</div><div class="excerpt"><div class="small">OPENMUSE / 产品定位 · 评审样例</div><div class="excerpt-title">一个工作页面，连接内容与行动</div><p>资源保持独立身份，文档负责组合。团队与 Agent 使用同一批内容，修改结果可追踪。</p><div class="excerpt-rule"></div><div class="small">示意页面，不代表真实 PDF 渲染</div></div><div class="source-meta">来源版本已固定，移除此块不会删除来源。</div></div>';
      const documentBody=()=>{
        if(state.connected==='revoked') return '<div class="document"><h1>资源当前不可访问</h1><p class="muted">后续读取和提交已停止。已保存草稿按账户的数据策略处理。</p>'+button('dialog:connection','查看连接状态')+'</div>';
        if(state.route==='dataset') return '<div class="document"><div class="eyebrow">'+icon('database')+' 独立资源 / 数据集</div><h1>发布任务</h1><p class="muted">与「Muse 发布计划」中的看板使用同一批记录。</p>'+datasetBlock(true)+'<div class="notice">'+icon('link-2')+' 被 Muse 发布计划引用 '+button('route:document','回到文档','quiet')+'</div><div class="panel-note">离线时可以读取已缓存记录，新的业务提交保持私有草稿。</div></div>';
        if(state.route==='office') return '<div class="document"><div class="eyebrow">'+icon('file-text')+' 独立资源 / 固定版本预览</div><h1>产品定位.pdf</h1>'+officeBlock(true)+button('route:document',icon('arrow-left')+' 返回引用文档','quiet')+'</div>';
        return '<div class="document"><div class="eyebrow">'+icon('sparkles')+' 智能文档 <span>·</span> 团队资源</div><h1>Muse 发布计划</h1><div class="doc-meta"><span>你与林晓共同维护</span><span>2026 年 11 月 5 日</span></div><div class="editable" role="textbox" aria-label="文档概览" contenteditable="'+canEdit()+'" spellcheck="false">'+escapeText(state.text)+'</div><div class="remote-line">'+icon('text-cursor-input')+' '+(state.connected==='online'?'林晓正在「发布任务」中编辑':'在线状态暂不可用，本机内容仍保留')+'</div>'+(state.applied?'<div class="proposal"><div class="small">Agent 已提交 · 来源：发布任务</div><p>'+escapeText(state.applied)+'</p></div>':'')+'<h2>发布进展</h2>'+(state.datasetEmbed?datasetBlock(false):'')+(state.embed?officeBlock(false):'')+'<div class="actionrow">'+button('dialog:insert',icon('plus')+' 插入内容','quiet',canEdit()?'':'disabled')+button('dialog:app',icon('layout-template')+' 构建应用','quiet',canEdit()?'':'disabled')+'</div></div>';
      };
      const panelBody=()=>{
        if(state.route==='office')return '<h3>材料上下文</h3><p>当前材料为固定版本只读预览。</p><p class="small">回到文档后，可以明确选择这份材料作为参考，再对目标内容生成建议。</p>'+button('route:document','回到发布计划','primary');
        if(state.panel==='comments') return '<h3>评论</h3><div class="small">当前文档 · 概览段落</div>'+state.comments.map(c=>'<div class="comment-item"><strong>'+escapeText(c.author)+'</strong><p>'+escapeText(c.text)+'</p></div>').join('')+'<label class="small">添加评论<textarea class="prompt comment-input" placeholder="写下反馈…" '+(state.role==='view'||state.connected==='revoked'?'disabled':'')+'></textarea></label><div class="actionrow">'+button('comment:add','发布评论','primary',state.role==='view'||state.connected!=='online'?'disabled':'')+'</div>';
        if(state.panel==='history') return '<h3>版本历史</h3><p class="small">正文与材料版本分别记录</p>'+button('history:preview','<span>v12 · 今天 10:24</span><span class="small">林晓</span>','history-item')+button('history:preview','<span>v11 · 今天 09:12</span><span class="small">你</span>','history-item')+'<div class="scope"><h3>引用材料</h3><div class="small">产品定位.pdf · 固定 v12<br>发布任务 · 实时视图</div></div><p class="panel-note">恢复正文不会自动回滚独立数据集。</p>';
        let proposal='';
        if(state.proposal){
          proposal='<div class="proposal"><div class="small '+(state.proposal.conflict?'danger':'')+'">'+(state.proposal.conflict?'目标内容已变化':'建议 · 尚未提交 · '+(state.proposal.target==='dataset'?'发布任务':'发布计划'))+'</div><p>'+escapeText(state.proposal.text)+'</p><div class="small">来源：发布任务 · 3 条记录</div><div class="actionrow">'+(state.proposal.conflict?button('agent:generate','重新读取并生成','primary'):button('agent:apply',state.proposal.target==='dataset'?'应用到发布任务':'应用到文档','primary',canEdit()?'':'disabled'))+button('agent:discard','丢弃','quiet')+'</div></div>';
        }
        return '<h3>与 Agent 一起完成</h3><p class="small">使用当前资源与明确选择的材料。</p><div class="scope"><label class="small">修改范围<select class="scope-select"><option value="selection" '+(state.scope==='selection'?'selected':'')+'>'+ (state.route==='dataset'?'发布任务记录':'概览与发布进展')+'</option><option value="document" '+(state.scope==='document'?'selected':'')+'>'+ (state.route==='dataset'?'当前数据集':'当前文档')+'</option></select></label><div class="small" style="margin-top:8px">参考资料：发布任务</div></div><textarea class="prompt agent-prompt" aria-label="Agent 指令">'+(state.route==='dataset'?'将待开始的移动端关键流程更新为进行中，并说明建议。':'归纳当前发布风险，并给出下一步建议。')+'</textarea><div class="actionrow">'+button('agent:generate',icon('sparkles')+' 生成建议','primary',canEdit()&&state.connected==='online'?'':'disabled')+'</div>'+proposal+'<p class="panel-note">建议应用后进入共享历史；文档发生变化时先校验修改目标。</p>';
      };
      const dialogBody=()=>{
        const close=button('dialog:close',icon('x'),'quiet','aria-label="关闭对话框"');
        const frame=(title,body)=>'<div class="dialog-layer"><section class="dialog" role="dialog" aria-modal="true" aria-label="'+title+'"><div class="dialog-title"><h2>'+title+'</h2>'+close+'</div>'+body+'</section></div>';
        if(state.dialog==='insert') return frame('插入内容','<p class="small">从已授权资源中选择，保留来源与版本。</p><div class="option">'+icon('file-text')+'<div><strong>产品定位.pdf</strong><div class="small">第 3 页 · 固定 v12 · 示例资源</div></div>'+button('insert:pdf','插入','primary')+'</div><div class="option">'+icon('database')+'<div><strong>发布任务</strong><div class="small">引用已有数据集视图</div></div>'+button('insert:dataset','引用')+'</div><div class="option">'+icon('image')+'<div>图片 / 视频<div class="small">按本机插件和来源能力开放</div></div>'+button('insert:media','查看范围','quiet')+'</div>');
        if(state.dialog==='share') return frame('共享与协作','<p>当前资源：'+(state.route==='dataset'?'发布任务':state.route==='office'?'产品定位.pdf':'Muse 发布计划')+'</p><div class="option"><span>林晓</span><span class="small">编辑者</span></div><div class="option"><span>你</span><span class="small">所有者</span></div><label>评审角色预览<select class="role-select"><option value="edit" '+(state.role==='edit'?'selected':'')+'>编辑者</option><option value="comment" '+(state.role==='comment'?'selected':'')+'>评论者</option><option value="view" '+(state.role==='view'?'selected':'')+'>只读</option></select></label><p class="small">来源材料保留独立权限；此处是交互演示，不实际邀请用户。</p>'+button('share:copy','复制资源引用','primary'));
        if(state.dialog==='connection') return frame('保存与协作','<div class="option"><span>本机内容</span><span class="good">已保存</span></div><div class="option"><span>团队连接</span><span>'+escapeText(statusText())+'</span></div><p class="small" style="margin-top:14px">协作服务暂不可用时，已支持的正文操作仍可在本机保存。连接恢复后再追赶共享状态。</p>'+button('connection:retry','重新连接','primary',state.connected==='revoked'?'disabled':'')+'<div class="actionrow">'+button('connection:offline','演示离线','quiet')+button('connection:unavailable','演示服务停用','quiet')+'</div>');
        if(state.dialog==='plugins') return frame('当前资源的能力','<div class="option">'+icon('file-text')+'<div>智能文档<div class="small">编辑 · 本机保存</div></div><span class="good">已启用</span></div><div class="option">'+icon('users')+'<div>Cloud 协作<div class="small">共享连接 · 在线状态</div></div><span class="small">'+(state.connected==='unavailable'?'不可用':'已装配')+'</span></div><div class="option">'+icon('file')+'<div>PDF 内容<div class="small">固定版本预览</div></div><span class="good">可用</span></div><p class="panel-note">停用连接不会卸载内容编辑器，也不会删除用户内容。</p><div class="actionrow">'+button('connection:unavailable','演示停用协作连接')+button('connection:retry','恢复连接','primary')+'</div>');
        if(state.dialog==='app') return frame('构建文档应用','<p>将已有数据组合成任务工作面。</p><div class="scope"><strong>项目任务</strong><p class="small">数据源：发布任务<br>组件：表格、看板、新建任务表单</p></div><p class="small">同一数据集也可由独立资源页和 Agent 操作。</p>'+button('app:insert','使用此模板','primary'));
        if(state.dialog==='restore') return frame('恢复正文版本','<p>把正文恢复为 v12 的内容，创建一个新的版本。</p><p class="small">发布任务与 PDF 来源不会被回滚。旧的离线修改保留为待处理草稿。</p>'+button('history:restore','恢复为新版本','primary'));
        return '';
      };
      const shell=layout=>{
        const current=state.route;
        const shown=state.shownPanel[layout];
        const title=current==='dataset'?'发布任务':current==='office'?'产品定位.pdf':'Muse 发布计划';
        return '<div class="windowbar"><div class="traffic"><span></span><span></span><span></span></div><span>OpenMuse</span><span class="prototype-label">交互评审 · 示例数据</span></div><div class="workbench"><nav class="sidebar" aria-label="Host 工作区"><div class="brand"><span class="brandmark">'+icon('sparkles')+'</span>OpenMuse</div>'+button('dialog:insert',icon('plus')+' 新建 / 插入','quiet')+'<div class="section-label">项目 Workspace</div>'+button('route:document',icon('file-text')+' 发布计划',current==='document'?'selected':'quiet')+button('route:dataset',icon('database')+' 发布任务',current==='dataset'?'selected':'quiet')+button('route:office',icon('file')+' 产品定位.pdf',current==='office'?'selected':'quiet')+'<div class="section-label">资源与材料</div><div class="small" style="padding:5px 8px">统一身份 · 按能力打开</div><div class="bottom">'+button('dialog:plugins',icon('puzzle')+' 插件与能力','quiet')+'</div></nav><main class="main"><div class="tabs">'+button('route:document',icon('file-text')+' 发布计划',current==='document'?'current quiet':'quiet')+(current==='dataset'?button('route:dataset',icon('database')+' 发布任务','current quiet'):'')+(current==='office'?button('route:office',icon('file')+' 产品定位.pdf','current quiet'):'')+button('panel:agent',icon('panel-right')+' Agent','quiet','aria-label="切换 Agent 面板"')+'</div><header class="resourcebar"><div class="crumb">项目 / <span class="resource-title">'+title+'</span></div>'+button('dialog:connection',icon(state.connected==='online'?'cloud-check':'cloud-off')+' '+statusText(),'quiet status')+'<div class="avatars"><span class="avatar">你</span><span class="avatar">林</span></div>'+button('dialog:share',icon('users')+' 共享','primary')+'</header>'+(state.role!=='edit'?'<div class="notice">'+(state.role==='view'?'当前为只读预览':'当前可阅读与评论，不能修改正文')+'</div>':'')+(state.history?'<div class="notice">正在查看正文版本 v12 '+button('history:exit','退出历史预览','quiet')+button('dialog:restore','恢复此版本')+'</div>':'')+'<div class="bodygrid">'+documentBody()+'<aside class="context" aria-label="Host 上下文面板"><div class="context-tabs">'+['agent','comments','history'].map((p,i)=>button('panel:'+p,['Agent','评论','历史'][i],state.panel===p?'selected':'quiet')).join('')+(layout!=='workbench'?button('panel:close',icon('x'),'quiet','aria-label="关闭资源上下文"'):'')+'</div><div class="context-content">'+panelBody()+'</div></aside></div><div class="mobile-tools">'+button('dialog:insert',icon('plus')+' 插入','quiet',canEdit()?'':'disabled')+button('panel:comments',icon('message-square')+' 评论','quiet')+button('panel:agent',icon('sparkles')+' Agent','quiet')+button('dialog:connection',icon('cloud')+' 状态','quiet')+'</div>'+(state.toast?'<div class="toast" role="status">'+escapeText(state.toast)+'</div>':'')+'<footer class="footer"><span>'+ (state.connected==='revoked'?'访问受限':state.route==='office'?'只读预览 · PDF':canEdit()?(state.route==='dataset'?(state.connected==='online'?'可编辑 · 数据集':'离线快照 · 数据集'):'可编辑 · 智能文档'):'只读内容')+'</span><span>材料保持独立身份</span></footer></main></div>'+dialogBody();
      };
      function render(){
        root.querySelectorAll('.app').forEach(app=>{
          const layout=app.dataset.layout;
          app.classList.toggle('show-context',state.shownPanel[layout]);
          app.innerHTML=shell(layout);
          const documentView=app.querySelector('.document');if(documentView && layout==='mobile')documentView.inert=state.shownPanel[layout];
        });
        if(globalThis.lucide) globalThis.lucide.createIcons({attrs:{width:16,height:16}});
      }
      function act(action,app){
        const parts=action.split(':'); const kind=parts[0],value=parts[1];
        const layout=app.dataset.layout; state.toast='';
        if(kind==='route'){state.route=value;state.history=false;state.dialog='';}
        if(kind==='dialog'){state.dialog=value==='close'?'':value;}
        if(kind==='view'){state.board=value==='board';}
        if(kind==='task' && canEdit() && state.connected==='online'){
          const t=state.tasks.find(t=>t.id===value); if(t)t.status=(t.status+1)%3;
          state.revision++;state.toast='记录已更新；文档视图与独立数据集使用同一来源。';
        }
        if(kind==='panel'){
          if(value==='close')state.shownPanel[layout]=false;
          else {const same=state.panel===value;state.panel=value;state.shownPanel[layout]=(same && state.shownPanel[layout] && value==='agent' && layout!=='workbench')?false:true;}
        }
        if(kind==='agent'){
          if(value==='generate' && canEdit() && state.connected==='online'){
            const remaining=state.tasks.filter(t=>t.status!==2).length;
            state.proposal={target:state.route,revision:state.revision,text:state.route==='dataset'?'建议将「移动端关键流程」更新为进行中，优先验证手机端阅读、评论和返回流程。':'当前仍有 '+remaining+' 项发布任务未完成。建议优先完成交互评审与移动端流程验证，再冻结本轮交付范围。',conflict:false};
          }
          if(value==='apply' && state.proposal && canEdit()){
            if(state.proposal.revision!==state.revision)state.proposal.conflict=true;
            else {if(state.proposal.target==='dataset'){state.tasks.find(t=>t.id==='t3').status=1;state.toast='Agent 已更新发布任务，所有视图共用同一结果。';}else{state.applied=state.proposal.text;state.toast='Agent 建议已应用，来源与本次修改已记录。';}state.proposal=null;state.revision++;}
          }
          if(value==='discard')state.proposal=null;
        }
        if(kind==='comment' && value==='add' && state.role!=='view' && state.connected==='online'){
          const input=app.querySelector('.comment-input');
          if(input && input.value.trim()){state.comments.push({author:'你',text:input.value.trim()});state.toast='评论已发布，正文没有改变。';}
        }
        if(kind==='insert'){
          state.dialog='';
          if(value==='pdf' && canEdit()){state.embed=true;state.toast='已引用产品定位.pdf 第3页；来源保持独立。';}
          if(value==='dataset'){state.datasetEmbed=true;state.route='document';state.toast='已引用原有数据集，没有复制记录。';}
          if(value==='media')state.toast='此评审聚焦资源组合；媒体播放能力在产品范围中单独验收。';
        }
        if(kind==='remove' && canEdit()){if(value==='dataset')state.datasetEmbed=false;if(value==='office')state.embed=false;state.revision++;state.toast='已移除这处引用，源资源与记录仍保留。';}
        if(kind==='app' && canEdit()){state.board=true;state.dialog='';state.toast='项目任务模板已绑定同一数据集，未复制源数据。';}
        if(kind==='connection'){
          if(value==='offline')state.connected='offline';
          if(value==='unavailable')state.connected='unavailable';
          if(value==='retry' && state.connected!=='revoked')state.connected='online';
          state.dialog='';state.toast=value==='retry'?'连接已恢复，共享状态已追赶。':'已支持的本机编辑继续可用；数据提交等待连接恢复。';
        }
        if(kind==='share'){state.dialog='';state.toast='资源引用已准备好；演示未写入系统剪贴板，也未扩大来源权限。';}
        if(kind==='history'){
          if(value==='preview'){state.history=true;state.route='document';}
          if(value==='exit')state.history=false;
          if(value==='restore'){state.text=base.text;state.applied='';state.proposal=null;state.history=false;state.dialog='';state.revision++;state.toast='正文恢复为新版本；数据集和来源材料未被回滚。';}
        }
        render();save();
        if(kind==='panel' && layout==='mobile'){const target=state.shownPanel[layout]?app.querySelector('.context button'):app.querySelector('.mobile-tools button[data-action="panel:agent"]');if(target)target.focus();}
        if(state.dialog){const d=app.querySelector('.dialog');const focus=d&&d.querySelector('button,input,select');if(focus)focus.focus();}
      }
      root.addEventListener('click',event=>{
        const b=event.target.closest('button[data-action]');if(!b||b.disabled)return;
        const app=b.closest('.app');if(app)act(b.dataset.action,app);
      });
      root.addEventListener('change',event=>{
        if(event.target.matches('.scope-select')){state.scope=event.target.value;save();}
        if(event.target.matches('.role-select')){state.role=event.target.value;render();save();}
      });
      root.addEventListener('input',event=>{
        if(event.target.matches('.editable') && canEdit()){state.text=event.target.textContent;state.revision++;save();}
      });
      root.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.dialog){state.dialog='';render();}});
      if(window.openai)restore(window.openai.widgetState);
      render();
      window.addEventListener('openai:set_globals',event=>{const incoming=event.detail&&event.detail.globals&&event.detail.globals.widgetState;if(!incoming||!incoming.privateContent||JSON.stringify(incoming.privateContent)===lastSavedSignature)return;restore(incoming);render();});
      if(globalThis.Tweak){
        const settings={connection:state.connected,spacing:32};
        const tweak=new Tweak({container:root,onChange:()=>{
          state.connected=settings.connection;render();
          root.querySelectorAll('.document').forEach(el=>{el.style.paddingTop=settings.spacing+'px';el.style.paddingBottom=settings.spacing+'px';});
        }});
        tweak.addSelect(settings,'connection',{label:'评审连接状态',options:[{label:'在线',value:'online'},{label:'离线',value:'offline'},{label:'协作服务不可用',value:'unavailable'},{label:'访问撤销',value:'revoked'}]});
        tweak.addSlider(settings,'spacing',{label:'内容留白',min:20,max:48,step:4,unit:'px'});
      }
    })();
  </script>
</div>
