[package]
name = "collab-database"
version = "0.2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
collab = { git = "https://github.com/AppFlowy-IO/AppFlowy-Collab", rev = "e59260e524f33104b0ddcd6bb8f6218cad0f7e18" }
collab-entity = { git = "https://github.com/AppFlowy-IO/AppFlowy-Collab", rev = "e59260e524f33104b0ddcd6bb8f6218cad0f7e18" }
serde = { version = "1.0.157", features = ["derive", "rc"] }
serde_json = { version = "1.0.108" }
thiserror = { version = "1.0.39" }
anyhow = { version = "1.0.94" }
serde_repr = "0.1"
tokio = { version = "1.38", features = ["rt", "sync", "time"] }
tracing = { version = "0.1.22" }
nanoid = "0.4.0"
chrono = { version = "0.4.38", default-features = false, features = ["clock"] }
lazy_static = "1.4.0"
async-trait = { version = "0.1" }
uuid = { version = "1.3.3", features = ["v4", "v5"] }
tokio-stream = { version = "0.1.14", features = ["sync"] }
strum = "0.25"
strum_macros = "0.25"
rayon = "1.10.0"
dashmap = "5"
futures = "0.3.30"
csv = { version = "1.3.0" }
yrs = { version = "0.23.5", features = ["sync"] }
tokio-util = "0.7"
rusty-money = { version = "0.4.1", features = ["iso"] }
fancy-regex = "0.13.0"
rust_decimal = "1.36.0"
chrono-tz = "0.10.0"
percent-encoding = "2.3.1"
sha2 = "0.10.8"
base64 = "0.22.1"
iana-time-zone = "0.1.61"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"

[features]
verbose_log = []
import_csv = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.38", features = ["fs"] }
