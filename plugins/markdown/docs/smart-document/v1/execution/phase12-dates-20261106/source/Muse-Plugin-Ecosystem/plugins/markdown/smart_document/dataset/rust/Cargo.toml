[package]
name = "muse-dataset-core"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
collab = { git = "https://github.com/AppFlowy-IO/AppFlowy-Collab", rev = "e59260e524f33104b0ddcd6bb8f6218cad0f7e18" }
collab-database = { git = "https://github.com/AppFlowy-IO/AppFlowy-Collab", rev = "e59260e524f33104b0ddcd6bb8f6218cad0f7e18" }
collab-entity = { git = "https://github.com/AppFlowy-IO/AppFlowy-Collab", rev = "e59260e524f33104b0ddcd6bb8f6218cad0f7e18" }
muse-appflowy-wire = { path = "../../runtime/appflowy_wire" }
async-trait = "0.1"
dashmap = "5"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v5"] }
chrono = "0.4.45"
chrono-tz = "0.10.4"
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
uuid = { version = "1", features = ["v4", "v5", "js"] }
fastrand = { version = "2", features = ["js"] }
[patch."https://github.com/AppFlowy-IO/AppFlowy-Collab"]
collab = { path = "../../vendor/appflowy_collab/collab" }
collab-database = { path = "../../vendor/appflowy_database" }
