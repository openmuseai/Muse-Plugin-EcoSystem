name: muse_smart_document_stage1
description: First-stage smart-document workbench using the public Muse resource SDK.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  appflowy_editor:
    path: ../../vendor/appflowy_editor
  openmuse_smart_document:
    path: ..
  openmuse_smart_document_plugin:
    path: ../../../../../../Muse-Client/plugins/smart-document
  openmuse_plugin_sdk:
    path: ../../../../../../Muse-Client/packages/openmuse_plugin_sdk
  muse_resource_center_io:
    path: ../../../../../../Muse-Client/packages/muse_resource_center_io
  openmuse_dataset:
    path: ../../dataset/flutter
  openmuse_dataset_plugin:
    path: ../../../../../../Muse-Client/plugins/dataset
  path_provider: ^2.1.5
  http: ^1.2.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/test-image.png

# The fixture uses the host-compatible picker; 8.x compiles against API 34.
dependency_overrides:
  file_picker: 10.3.10
