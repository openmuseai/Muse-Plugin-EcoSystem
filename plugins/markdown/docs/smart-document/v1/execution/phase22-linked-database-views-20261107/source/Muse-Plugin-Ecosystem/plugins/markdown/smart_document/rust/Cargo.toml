[package]
name = "muse-smart-document"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
collab = { git = "https://github.com/AppFlowy-IO/AppFlowy-Collab", rev = "e59260e524f33104b0ddcd6bb8f6218cad0f7e18" }
collab-document = { git = "https://github.com/AppFlowy-IO/AppFlowy-Collab", rev = "e59260e524f33104b0ddcd6bb8f6218cad0f7e18" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
muse-appflowy-wire = { path = "../runtime/appflowy_wire" }
uuid = { version = "1", features = ["v4"] }
url = "=2.5.4"
sha2 = "=0.10.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
uuid = { version = "1", features = ["v4", "js"] }
fastrand = { version = "2", features = ["js"] }

[dev-dependencies]
tempfile = "3"

[patch."https://github.com/AppFlowy-IO/AppFlowy-Collab"]
collab = { path = "../vendor/appflowy_collab/collab" }

[patch.crates-io]
yrs = { path = "../vendor/yrs" }
