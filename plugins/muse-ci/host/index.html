<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Muse-CI · MCP Apps 验证 Host</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}iframe{display:block}#error{font:16px system-ui;padding:30px}</style></head><body><div id="error">正在通过 MCP 加载插件…</div><iframe id="app" title="Muse-CI MCP App" sandbox="allow-scripts allow-downloads" hidden></iframe><script>
(async()=>{
const frame=document.getElementById('app'),error=document.getElementById('error');
async function rpc(method,params){const res=await fetch('/api/host/rpc',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({method,params})});const data=await res.json();if(!res.ok)throw Error(data.error);return data.result;}
try{await fetch('/api/session');const tools=await rpc('tools/list',{}),allowed=new Set(tools.tools.map(t=>t.name));const resources=await rpc('resources/list',{});const uris=new Set(resources.resources.map(r=>r.uri));const entry=tools.tools.find(t=>t._meta?.ui?.resourceUri);if(!entry||!uris.has(entry._meta.ui.resourceUri))throw Error('APP_ENTRY_NOT_FOUND');const result=await rpc('resources/read',{uri:entry._meta.ui.resourceUri});const html=result.contents.find(c=>c.mimeType==='text/html;profile=mcp-app')?.text;if(!html)throw Error('UI_RESOURCE_MISSING');
window.addEventListener('message',async event=>{if(event.source!==frame.contentWindow)return;const m=event.data;if(!m||m.jsonrpc!=='2.0'||typeof m.method!=='string')return;const send=result=>frame.contentWindow.postMessage({jsonrpc:'2.0',id:m.id,result},'*');if(m.id===undefined)return;
try{if(m.method==='ui/initialize')return send({protocolVersion:m.params.protocolVersion,hostInfo:{name:'OpenMuse generic development host',version:'0.1.0'},hostCapabilities:{serverTools:{listChanged:false},serverResources:{listChanged:false}},hostContext:{theme:'light',platform:'web',displayMode:'fullscreen'}});if(m.method==='ping')return send({});if(m.method==='tools/call'&&!allowed.has(m.params?.name))throw Error('TOOL_NOT_ALLOWED');if(m.method==='resources/read'&&!uris.has(m.params?.uri))throw Error('RESOURCE_DENIED');if(!['tools/call','tools/list','resources/list','resources/read'].includes(m.method))throw Error('METHOD_NOT_ALLOWED');send(await rpc(m.method,m.params));}catch(e){frame.contentWindow.postMessage({jsonrpc:'2.0',id:m.id,error:{code:-32000,message:e.message}},'*');}});
const csp='<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; script-src \'unsafe-inline\'; style-src \'unsafe-inline\'; img-src data: blob:; connect-src \'none\'; font-src data:; base-uri \'none\'; form-action \'none\'">';frame.srcdoc=html.replace('<head>','<head>'+csp);frame.hidden=false;error.hidden=true;
}catch(e){error.textContent=e.message;}
})();
</script></body></html>
