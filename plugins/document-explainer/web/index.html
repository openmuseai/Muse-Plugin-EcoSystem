<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:light dark;--paper:#fff;--ink:#20242c;--subtle:#586273;--control:#eef0f3;--accent:#1768cf;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;color:var(--ink)}*{box-sizing:border-box}body{margin:0;background:transparent;padding:0}section{background:var(--paper);border-radius:6px;padding:12px;display:grid;gap:9px}header{display:flex;justify-content:space-between;gap:8px;align-items:baseline}strong{font-size:14px;font-weight:600}#page{font-variant-numeric:tabular-nums;color:var(--subtle)}.actions{display:flex;gap:7px;flex-wrap:wrap}button,select{height:32px;padding:0 10px;font:inherit;color:inherit;border:0;border-radius:4px;background:var(--control);cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:active{transform:translateY(1px)}#start{background:var(--accent);color:#fff;font-weight:500}button:disabled,select:disabled{opacity:.55;cursor:default}#status{font-size:12px;line-height:1.45;min-height:18px;max-height:36px;overflow:auto;color:var(--subtle);overflow-wrap:anywhere}#status[data-state=error]{color:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#292d34;--ink:#f2f3f6;--subtle:#bcc4d1;--control:#3d434d;--accent:#3984de}}@media(max-width:310px){section{padding:9px}.actions{gap:5px}button,select{padding:0 7px}}@media(prefers-reduced-motion:reduce){button:active{transform:none}}
</style></head><body><section aria-label="文档讲解" data-ui><header><strong>文档讲解</strong><span id="page"></span></header><div class="actions"><select id="mode" aria-label="起始页"><option value="first">从第一页</option><option value="current">从当前页</option></select><button id="start">开始讲解</button><button id="stop" disabled>停止</button></div><div id="status" role="status" aria-live="polite">正在连接编辑器</div></section><!--SCRIPT--></body></html>
